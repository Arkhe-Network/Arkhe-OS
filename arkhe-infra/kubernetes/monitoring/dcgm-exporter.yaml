# kubernetes/monitoring/dcgm-exporter.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dcgm-exporter
  namespace: gpu-operator
  labels:
    app: dcgm-exporter
spec:
  selector:
    matchLabels:
      app: dcgm-exporter
  template:
    metadata:
      labels:
        app: dcgm-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9400"
    spec:
      hostPID: true
      containers:
      - name: dcgm-exporter
        image: nvidia/dcgm-exporter:3.3.5-3.3.0-ubuntu22.04
        args:
        - -f
        - /etc/dcgm-exporter/default-counters.csv
        ports:
        - containerPort: 9400
          hostPort: 9400
        securityContext:
          privileged: true
        env:
        - name: DCGM_EXPORTER_LISTEN
          value: ":9400"
        volumeMounts:
        - name: dev
          mountPath: /dev
        - name: run
          mountPath: /run
        - name: sys
          mountPath: /sys
        - name: usr
          mountPath: /usr
      volumes:
      - name: dev
        hostPath:
          path: /dev
      - name: run
        hostPath:
          path: /run
      - name: sys
        hostPath:
          path: /sys
      - name: usr
        hostPath:
          path: /usr
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule