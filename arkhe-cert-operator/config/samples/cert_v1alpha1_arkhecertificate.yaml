apiVersion: cert.arkhe.os/v1alpha1
kind: ArkheCertificate
metadata:
  name: arkhe-sophon-network-cert
  namespace: arkhe-production
spec:
  serviceName: arkhe-sophon-network
  commonName: arkhe-sophon-network.arkhe-production.svc.cluster.local
  dnsNames:
    - arkhe-sophon-network.arkhe-production.svc
    - arkhe-sophon-network.arkhe-production.svc.cluster.local
    - "*.arkhe-production.svc.cluster.local"
  validityDays: 90
  rotationThresholdDays: 14
  keystoreType: PKCS12
  keystorePasswordSecret:
    name: arkhe-keystore-passwords
    key: sophon-network-password
  truststoreCARef:
    secretName: arkhe-ca-cert
    certKey: ca-cert.pem
  triggerRollingUpdate: true
  issuerRef:
    name: arkhe-internal-issuer
    kind: ClusterIssuer
