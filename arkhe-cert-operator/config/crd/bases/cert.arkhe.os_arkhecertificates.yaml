apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: arkhecertificates.cert.arkhe.os
  annotations:
    cert-manager.io/inject-ca-from: "arkhe-system/arkhe-cert-operator-serving-cert"
spec:
  group: cert.arkhe.os
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["serviceName", "commonName"]
              properties:
                serviceName:
                  type: string
                  description: "Name of the ARKHE microservice"
                commonName:
                  type: string
                  description: "Common Name for the certificate"
                dnsNames:
                  type: array
                  items:
                    type: string
                validityDays:
                  type: integer
                  default: 90
                  minimum: 30
                  maximum: 365
                rotationThresholdDays:
                  type: integer
                  default: 14
                  minimum: 1
                  maximum: 30
                keystoreType:
                  type: string
                  enum: ["PKCS12", "JKS"]
                  default: "PKCS12"
                keystorePasswordSecret:
                  type: object
                  properties:
                    name: {type: string}
                    key: {type: string}
                truststoreCARef:
                  type: object
                  properties:
                    secretName: {type: string}
                    certKey: {type: string}
                triggerRollingUpdate:
                  type: boolean
                  default: true
                issuerRef:
                  type: object
                  required: ["name"]
                  properties:
                    name: {type: string}
                    kind: {type: string, enum: ["Issuer", "ClusterIssuer"], default: "Issuer"}
                    group: {type: string, default: "cert-manager.io"}
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: {type: string, enum: ["Ready", "Rotating", "Error"]}
                      status: {type: string, enum: ["True", "False", "Unknown"]}
                      reason: {type: string}
                      message: {type: string}
                      lastTransitionTime: {type: string, format: date-time}
                currentCertificate:
                  type: object
                  properties:
                    serialNumber: {type: string}
                    notBefore: {type: string, format: date-time}
                    notAfter: {type: string, format: date-time}
                    daysUntilExpiry: {type: integer}
                lastRotationTime: {type: string, format: date-time}
                keystoreSecretName: {type: string}
  scope: Namespaced
  names:
    plural: arkhecertificates
    singular: arkhecertificate
    kind: ArkheCertificate
    shortNames: ["arkhecert"]
  additionalPrinterColumns:
    - name: Service
      type: string
      jsonPath: .spec.serviceName
    - name: CommonName
      type: string
      jsonPath: .spec.commonName
    - name: DaysUntilExpiry
      type: integer
      jsonPath: .status.currentCertificate.daysUntilExpiry
    - name: Status
      type: string
      jsonPath: .status.conditions[?(@.type=="Ready")].status
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
