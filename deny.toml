[advisories]
ignore = [
    "RUSTSEC-2024-0437",
    "RUSTSEC-2025-0141",
    "RUSTSEC-2024-0380",
    "RUSTSEC-2026-0163",
    "RUSTSEC-2024-0381",
    "RUSTSEC-2026-0162",
    "RUSTSEC-2025-0134",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    "RUSTSEC-2024-0363",
    "RUSTSEC-2024-0436"
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0"
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[[bans.deny]]
name = "failure"

[[bans.deny]]
name = "rustc-serialize"

[sources]
unknown-registry = "allow"
unknown-git = "allow"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
