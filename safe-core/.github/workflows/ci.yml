name: CI

on:
  push:
    branches: [main, develop, release/**]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: Build & Test (Rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [1.81.0, stable, beta]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/* -> target
            bin/* -> target
          cache-all-crates: true

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy (Lint)
        run: cargo clippy --workspace --all-features -- -D warnings -D clippy::pedantic

      - name: Build (Debug)
        run: cargo build --workspace --all-features

      - name: Run Unit & Integration Tests
        run: cargo test --workspace --all-features -- --nocapture

      - name: Run Doc Tests
        run: cargo test --workspace --all-features --doc

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo-audit
        run: cargo audit --workspace --ignore RUSTSEC-2023-0071

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: Run cargo-deny
        run: cargo deny --config .config/deny.toml check

  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    needs: [build-and-test, security-audit]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release
        run: cargo build --workspace --release --all-features

      - name: Upload Artifacts (Opcional)
        uses: actions/upload-artifact@v4
        with:
          name: safe-core-binaries
          path: target/release/safe-core-*

  msrv-check:
    name: Check MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/* -> target
            bin/* -> target
          cache-all-crates: true

      - name: Check MSRV
        run: cargo check --workspace --all-targets --all-features
