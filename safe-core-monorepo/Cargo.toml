[workspace]
members = [
    "crates/arkhe-core",
    "crates/arkhe-identity",
    "crates/arkhe-governance",
    "crates/arkhe-pea",
    "crates/arkhe-memory",
    "crates/arkhe-inference",
    "crates/arkhe-session-evaluator",
    "crates/arkhe-reflector-agent",
    "crates/arkhe-agi",
    "crates/arkhe-cli",
    "crates/arkhe-lean-spec-derive",
    # ✅ F2: 8 crates novos de segurança AISVS
    "crates/arkhe-rate-limit",
    "crates/arkhe-bom",
    "crates/arkhe-prompt-detector",
    "crates/arkhe-hallucination",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Arkhe OS Architects <arkhe@arkhe-os.org>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/arkhe-os/arkhe"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1.0", features = ["alloc"] }
blake3 = "1.5"
hex = "0.4"
sha2 = "0.10"
hkdf = "0.12"
hmac = "0.12"
rand = "0.8"
getrandom = "0.2"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["sync", "rt", "time", "macros", "fs", "process"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3.10"
clap = { version = "4.5", features = ["derive"] }
strsim = "0.11"
regex = "1"
dashmap = "5.5"
futures = "0.3"
sled = { version = "0.34" }
rmp-serde = { version = "1.3" }
mistralrs = { version = "0.8" }
candle-core = { version = "0.10.2" }
candle-nn = { version = "0.10.2" }
candle-transformers = { version = "0.10.2" }
llama-cpp-2 = { version = "0.1" }
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
# ✅ F3: Dependências faltantes adicionadas
unicode-normalization = "0.1"
wasmtime = { version = "28.0" }
# ✅ F1: ed25519-dalek v2.2.0 — API v2.x (SigningKey, não Keypair)
ed25519-dalek = { version = "2.2" }
zeroize = { version = "1.8" }


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
