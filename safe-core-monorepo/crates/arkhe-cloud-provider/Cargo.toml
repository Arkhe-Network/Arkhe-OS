[package]
name = "arkhe-cloud-provider"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Generic cloud provider trait with OpenNebula and EGI/OpenStack implementations"

[dependencies]
arkhe-core = { workspace = true }
arkhe-identity = { workspace = true }
arkhe-governance = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true, optional = true }
xmltree = { workspace = true, optional = true }
base64 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tempfile = { workspace = true }

[features]
default = []
opennebula = ["dep:reqwest", "dep:xmltree"]
openstack = ["dep:reqwest"]
all-providers = ["opennebula", "openstack"]
