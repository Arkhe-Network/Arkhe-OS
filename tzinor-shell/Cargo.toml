[package]
name = "tzinor-shell"
version = "0.1.0"
edition = "2021"
authors = ["Rafael Oliveira", "Arkhe(n) AI Agent"]
description = "Tzinor Interactive Shell - Phase-aware command interface for Arkhe(L)"
license = "MIT"

[dependencies]
rustyline = "12.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
dirs = "5.0"

[profile.release]
opt-level = 3
lto = true
