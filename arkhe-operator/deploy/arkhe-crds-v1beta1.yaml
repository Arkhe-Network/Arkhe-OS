# Arkhe(n) v1beta1 CRDs - Custom Resource Definitions
# Run: kubectl apply -f arkhe-crds-v1beta1.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: arkhe-quantum
---
# ThermalEngine CRD
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.13.0
  creationTimestamp: null
  name: thermalengines.arkhe.io
spec:
  group: arkhe.io
  names:
    kind: ThermalEngine
    listKind: ThermalEngineList
    plural: thermalengines
    shortNames:
    - te
    singular: thermalengine
  scope: Namespaced
  versions:
  - name: v1beta1
    schema:
      openAPIV3Schema:
        description: ThermalEngine is the Schema for the thermalengines API
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation of an object.'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this object represents.'
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired state of ThermalEngine
            properties:
              carnotLimit:
                description: CarnotLimit defines the thermodynamic limits
                properties:
                  coldReservoir:
                    type: number
                  hotReservoir:
                    type: number
                type: object
              heatSource:
                description: HeatSource defines the heat input
                properties:
                  entropyFlow:
                    type: number
                  temperature:
                    type: number
                  type:
                    type: string
                type: object
              programmability:
                description: Programmability defines instruction set support
                properties:
                  instructionSet:
                    items:
                      type: string
                    type: array
                  universal:
                    type: boolean
                type: object
              workOutput:
                description: WorkOutput defines the work output
                properties:
                  efficiencyTarget:
                    type: number
                  form:
                    type: string
                type: object
            required:
            - heatSource
            - workOutput
            - programmability
            type: object
          status:
            description: Status defines the observed state of ThermalEngine
            properties:
              currentEfficiency:
                type: number
              entropyProduced:
                type: number
              phase:
                type: string
              workDone:
                type: number
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
