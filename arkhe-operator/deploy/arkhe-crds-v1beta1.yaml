# GKPAtom CRD
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.13.0
  creationTimestamp: null
  name: gkpatoms.arkhe.io
spec:
  group: arkhe.io
  names:
    kind: GKPAtom
    listKind: GKPAtomList
    plural: gkpatoms
    shortNames:
    - gkp
    singular: gkpatom
  scope: Namespaced
  versions:
  - name: v1beta1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              atomicSpecies:
                type: string
              gkpEncoding:
                properties:
                  errorCorrection:
                    type: boolean
                  logicalQubits:
                    type: integer
                  squeezing:
                    type: number
                required:
                - logicalQubits
                - errorCorrection
                - squeezing
                type: object
              trapConfiguration:
                properties:
                  dimensions:
                    type: integer
                  rfFrequency:
                    type: number
                  type:
                    type: string
                required:
                - type
                - dimensions
                - rfFrequency
                type: object
              vibrationalModes:
                items:
                  properties:
                    frequency:
                      type: number
                    modeId:
                      type: integer
                    occupation:
                      type: integer
                  required:
                  - modeId
                  - frequency
                  - occupation
                  type: object
                type: array
            required:
            - atomicSpecies
            - trapConfiguration
            - gkpEncoding
            type: object
          status:
            properties:
              coherenceTime:
                type: number
              entanglement:
                properties:
                  fidelity:
                    type: number
                  modeA:
                    type: integer
                  modeB:
                    type: integer
                type: object
              gateFidelity:
                type: number
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
