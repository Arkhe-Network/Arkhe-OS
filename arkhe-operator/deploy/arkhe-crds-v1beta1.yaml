# Sample ThermalEngine Instance
apiVersion: arkhe.io/v1beta1
kind: ThermalEngine
metadata:
  name: body-heat-harvester
  namespace: arkhe-quantum
spec:
  heatSource:
    temperature: 310.0
    entropyFlow: 0.1
    type: Biological
  workOutput:
    form: Informational
    efficiencyTarget: 0.3
  programmability:
    universal: true
    instructionSet:
      - Carnot
      - Otto
      - Biological
  carnotLimit:
    hotReservoir: 310.0
    coldReservoir: 273.15
---
