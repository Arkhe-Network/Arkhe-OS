# ════════════════════════════════════════════════════════════════════════════════╗
#  EMERGENCY TZINOR - KUBERNETES CUSTOM RESOURCE DEFINITION
#  Teknet Node: ARKHE(N)-PRIME-0009-0005-2697-4668
#  Purpose: Orchestrate emergency radio communication via K8s operator
# ════════════════════════════════════════════════════════════════════════════════╝
#
# Este CRD define um canal Tzinor de emergência, permitindo que o operador
# Kubernetes configure rádios definidos por software (SDR) para transmitir
# sinais de emergência nas frequências apropriadas.

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: emergencytzinors.arkhe.io
  labels:
    app.kubernetes.io/name: arkhe-operator
    app.kubernetes.io/component: tzinor
    arkhe.io/role: emergency
spec:
  group: arkhe.io
  names:
    kind: EmergencyTzinor
    listKind: EmergencyTzinorList
    plural: emergencytzinors
    singular: emergencytzinor
    shortNames:
      - etz
      - etzinor
  scope: Namespaced
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - frequency
                - modulation
                - power
              properties:
                # Tipo de emergência (determina frequência automaticamente se não especificada)
                emergencyType:
                  type: string
                  enum:
                    - AviationCivil
                    - NavySonobuoy
                    - Ais
                    - Noaa
                    - Nato
                    - AviationMilitary
                    - Sarsat
                    - Epirb
                    - FederalDisaster
                    - FrsGmrs
                    - Murs
                    - HamRadio
                    - HfGcs
                  description: |
                    Tipo de emergência que determina a frequência e modulação padrão.
                    
                    Mapeamento ontológico:
                    - AviationCivil: 121.5 MHz - Aviacao Civil
                    - NavySonobuoy: 155.160 MHz - Marinha (sonobuoy)
                    - Ais: 162.025 MHz - AIS Broadcast (pi+)
                    - Noaa: 162.400-162.550 MHz - NOAA Weather
                    - Nato: 172.5 MHz - NATO Tactical
                    - AviationMilitary: 243.0 MHz - Aviacao Militar
                    - Sarsat: 282.8 MHz - Cospas-Sarsat
                    - Epirb: 406.0 MHz - EPIRB Distress
                    - FederalDisaster: 412.825 MHz - Federal Disaster
                    - FrsGmrs: 462.6125-462.725 MHz - FRS/GMRS Civil
                    - Murs: 151.820-154.600 MHz - MURS Multiuse
                    - HamRadio: 3.940-28.750 MHz - Radio Amador HF
                    - HfGcs: 4.724-11.175 kHz - HF-GCS Military

                # Frequencia em Hz (sobrescreve emergencyType se especificada)
                frequency:
                  type: number
                  format: double
                  minimum: 0
                  maximum: 3000000000
                  description: |
                    Frequencia do transmissor em Hz.
                    Se nao especificada, usa a frequencia padrao do emergencyType.

                # Frequencia maxima para ranges
                maxFrequency:
                  type: number
                  format: double
                  description: |
                    Frequencia maxima para ranges de frequencia (ex: NOAA).

                # Tipo de modulacao
                modulation:
                  type: string
                  enum:
                    - FM
                    - AM
                    - USB
                    - LSB
                    - GMSK
                  default: FM
                  description: Tipo de modulacao do sinal

                # Potencia do transmissor em Watts
                power:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  description: Potencia do transmissor em Watts

                # Cobertura em quilometros
                coverageRadiusKm:
                  type: number
                  format: double
                  minimum: 0
                  description: Raio de cobertura estimado em quilometros

                # Largura de banda em Hz
                bandwidthHz:
                  type: number
                  format: double
                  minimum: 1000
                  default: 25000
                  description: Largura de banda do canal em Hz

                # Nós autorizados a transmitir
                authorizedNodes:
                  type: array
                  items:
                    type: string
                  description: Lista de VerCore nodes autorizados a usar este canal

                # Prioridade (1-10, 10 = maior)
                priority:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 5
                  description: Prioridade do canal (usado para resource allocation)

                # Intervalo de beacon em segundos
                beaconIntervalSeconds:
                  type: integer
                  minimum: 1
                  description: Intervalo entre beacons de manutencao (0 = desativado)

                # Labels para seletor de nós
                nodeSelector:
                  type: object
                  additionalProperties:
                    type: string
                  description: Labels para selecionar nós VerCore específicos

            status:
              type: object
              properties:
                # Se o canal está ativo
                active:
                  type: boolean
                  description: Indica se o transmissor está atualmente ativo

                # Timestamp da última ativação
                lastActivation:
                  type: string
                  format: date-time
                  description: Timestamp ISO da última ativação do transmissor

                # Timestamp da última transmissão
                lastTransmission:
                  type: string
                  format: date-time
                  description: Timestamp ISO da última transmissão

                # Contador de transmissões
                transmissionCount:
                  type: integer
                  format: int64
                  description: Número total de transmissões realizadas

                # Status atual
                phase:
                  type: string
                  enum:
                    - Idle
                    - Activating
                    - Transmitting
                    - Error
                  description: Fase atual do Tzinor

                # Mensagem de erro (se phase=Error)
                errorMessage:
                  type: string
                  description: Mensagem de erro se houve falha

                # Condições do Kubernetes
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string

      additionalPrinterColumns:
        - name: Emergency
          type: string
          jsonPath: .spec.emergencyType
        - name: Frequency
          type: string
          jsonPath: .spec.frequency
          priority: 1
        - name: Active
          type: boolean
          jsonPath: .status.active
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

---
# ════════════════════════════════════════════════════════════════════════════════╗
#  EXEMPLOS DE EMERGENCY TZINOR
# ════════════════════════════════════════════════════════════════════════════════╝

# Exemplo 1: Tzinor de Aviação Civil
apiVersion: arkhe.io/v1beta1
kind: EmergencyTzinor
metadata:
  name: aviation-alert
  namespace: arkhe-system
  labels:
    arkhe.io/role: emergency
    arkhe.io/urgency: critical
spec:
  emergencyType: AviationCivil
  modulation: AM
  power: 100
  coverageRadiusKm: 200
  priority: 10
  beaconIntervalSeconds: 300
  authorizedNodes:
    - vercore-node-01
    - vercore-node-02
    - bexorg-edge-03

---
# Exemplo 2: Tzinor AIS (Broadcast de pi+)
apiVersion: arkhe.io/v1beta1
kind: EmergencyTzinor
metadata:
  name: ais-broadcast
  namespace: arkhe-system
spec:
  emergencyType: Ais
  frequency: 162.025e6
  modulation: GMSK
  power: 25
  coverageRadiusKm: 74
  priority: 8
  authorizedNodes:
    - vercore-ship-01
    - vercore-ship-02

---
# Exemplo 3: Tzinor NOAA Weather
apiVersion: arkhe.io/v1beta1
kind: EmergencyTzinor
metadata:
  name: noaa-weather
  namespace: arkhe-system
spec:
  emergencyType: Noaa
  frequency: 162.475e6
  maxFrequency: 162.550e6
  modulation: FM
  power: 1000
  coverageRadiusKm: 60
  priority: 9
  beaconIntervalSeconds: 60
  authorizedNodes:
    - vercore-noaa-*

---
# Exemplo 4: Tzinor EPIRB (Distress Marítimo)
apiVersion: arkhe.io/v1beta1
kind: EmergencyTzinor
metadata:
  name: maritime-distress
  namespace: arkhe-system
spec:
  emergencyType: Epirb
  modulation: GMSK
  power: 5
  coverageRadiusKm: 5000
  priority: 10
  authorizedNodes:
    - vercore-vessel-*

---
# Exemplo 5: Tzinor Federal Disaster
apiVersion: arkhe.io/v1beta1
kind: EmergencyTzinor
metadata:
  name: federal-disaster
  namespace: arkhe-system
spec:
  emergencyType: FederalDisaster
  frequency: 412.825e6
  modulation: FM
  power: 500
  coverageRadiusKm: 100
  priority: 10
  nodeSelector:
    node-type: emergency-response
    region: us-federal

---
# Exemplo 6: Tzinor HF-GCS (Comando Militar Global)
apiVersion: arkhe.io/v1beta1
kind: EmergencyTzinor
metadata:
  name: hf-gcs-command
  namespace: arkhe-system
spec:
  emergencyType: HfGcs
  frequency: 8922
  maxFrequency: 11175
  modulation: USB
  power: 1000
  coverageRadiusKm: 5000
  priority: 10
  bandwidthHz: 3000
  authorizedNodes:
    - vercore-military-*

---
# ════════════════════════════════════════════════════════════════════════════════╗
#  END OF EMERGENCY TZINOR CRD
# ════════════════════════════════════════════════════════════════════════════════╝
