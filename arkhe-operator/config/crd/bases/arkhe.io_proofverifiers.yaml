# ProofVerifier CRD - π² Universal Verification Layer
# Proof of Proof (π²) Integration for Arkhe(n)
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: proofverifiers.arkhe.io
  annotations:
    arkhe.io/description: "Verificador Universal π² para provas ontológicas"
    arkhe.io/version: "1.0.0"
  labels:
    app.kubernetes.io/name: arkhe-operator
    app.kubernetes.io/component: proof-verification
spec:
  group: arkhe.io
  names:
    kind: ProofVerifier
    listKind: ProofVerifierList
    plural: proofverifiers
    singular: proofverifier
    shortNames:
      - pv
      - proof
      - pi2
    categories:
      - arkhe
      - verification
  scope: Namespaced
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - language
                - programHash
                - expectedOutput
              properties:
                language:
                  type: string
                  enum:
                    - Solidity
                    - Rust
                    - Python
                    - C
                    - Cpp
                    - K
                    - Move
                    - Cairo
                    - Neural
                  description: "Linguagem do programa a ser verificado"
                sourceRef:
                  type: object
                  description: "Referência ao código-fonte"
                  properties:
                    configMapRef:
                      type: object
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                    gitRef:
                      type: object
                      properties:
                        repository:
                          type: string
                        commit:
                          type: string
                        path:
                          type: string
                programHash:
                  type: string
                  pattern: '^[0-9a-f]{64}$'
                  description: "SHA-256 do programa fonte para imutabilidade"
                input:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - Json
                        - Binary
                        - NeuralIntent
                        - None
                    data:
                      type: string
                expectedOutput:
                  type: object
                  required:
                    - type
                    - data
                  properties:
                    type:
                      type: string
                      enum:
                        - Json
                        - Binary
                        - MerkleRoot
                        - CoherenceScore
                    data:
                      type: string
                    tolerance:
                      type: number
                      default: 0.0
                verifierConfig:
                  type: object
                  properties:
                    proofSystem:
                      type: string
                      enum:
                        - Groth16
                        - Plonk
                        - STARK
                        - Halo2
                      default: Groth16
                    securityLevel:
                      type: integer
                      minimum: 100
                      maximum: 256
                      default: 128
                    verificationTimeout:
                      type: string
                      default: "5m"
                chainIntegration:
                  type: object
                  properties:
                    submitToChain:
                      type: boolean
                      default: true
                    walletRef:
                      type: string
                    eraRef:
                      type: string
                    gasLimit:
                      type: integer
                      default: 1000000
                neuralIntegration:
                  type: object
                  properties:
                    bexorgRef:
                      type: string
                    coherenceThreshold:
                      type: number
                      default: 0.95
                    thetaPhase:
                      type: number
                      description: "Fase theta esperada para prova neural"
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Computing
                    - Proving
                    - Verifying
                    - Verified
                    - Failed
                proof:
                  type: object
                  properties:
                    proofHash:
                      type: string
                    proofType:
                      type: string
                    proofData:
                      type: string
                    proofSize:
                      type: integer
                zkCertificate:
                  type: object
                  properties:
                    certificateHash:
                      type: string
                    certificateData:
                      type: string
                    circuitId:
                      type: string
                    verificationKey:
                      type: string
                metrics:
                  type: object
                  properties:
                    computeTime:
                      type: string
                    proofGenerationTime:
                      type: string
                    verificationTime:
                      type: string
                    gasUsed:
                      type: integer
                onChainRef:
                  type: object
                  properties:
                    txHash:
                      type: string
                    blockHeight:
                      type: integer
                    eraRef:
                      type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                startTime:
                  type: string
                  format: date-time
                completionTime:
                  type: string
                  format: date-time
      additionalPrinterColumns:
        - name: Language
          type: string
          jsonPath: .spec.language
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Proof Hash
          type: string
          jsonPath: .status.proof.proofHash
          priority: 1
        - name: Verified
          type: string
          jsonPath: .status.conditions[?(@.type=="Verified")].status
          priority: 1
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
