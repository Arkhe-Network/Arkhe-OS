apiVersion: apps/v1
kind: Deployment
metadata:
  name: arkhe-operator
  namespace: arkhe-system
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: arkhe-operator
  template:
    metadata:
      labels:
        control-plane: arkhe-operator
    spec:
      serviceAccountName: arkhe-operator
      containers:
      - name: operator
        image: arkhe/arkhe-operator:latest
        imagePullPolicy: Always
        args:
        - --metrics-addr=:8080
        - --health-probe-addr=:8081
        - --enable-webhooks=true
        ports:
        - containerPort: 8080
          name: metrics
        - containerPort: 8081
          name: health
        - containerPort: 9443
          name: webhook
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 10
