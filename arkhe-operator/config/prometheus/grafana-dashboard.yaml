apiVersion: v1
kind: ConfigMap
metadata:
  name: arkhe-operator-grafana-dashboard
  namespace: arkhe-system
  labels:
    grafana_dashboard: "1"
data:
  arkhe-dashboard.json: |
    {
      "dashboard": {
        "title": "Arkhe(n) Operator",
        "panels": [
          {
            "title": "Era Active Count",
            "type": "stat",
            "targets": [{"expr": "arkhe_era_active"}]
          },
          {
            "title": "Tzinor PLL Lock Rate",
            "type": "gauge",
            "targets": [{"expr": "arkhe_tzinor_locked"}]
          },
          {
            "title": "VerCore Temperature (mK)",
            "type": "graph",
            "targets": [{"expr": "arkhe_vercore_temp_millikelvin"}]
          },
          {
            "title": "Entropy Shield Blocks",
            "type": "stat",
            "targets": [{"expr": "arkhe_entropy_shield_blocks"}]
          },
          {
            "title": "Lambda-T Invocations",
            "type": "graph",
            "targets": [{"expr": "rate(arkhe_lambdat_invocations_total[5m])"}]
          }
        ]
      }
    }
