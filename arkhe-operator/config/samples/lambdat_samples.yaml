apiVersion: arkhe.io/v1alpha1
kind: LambdaT
metadata:
  name: oracle
  namespace: arkhe
spec:
  handler: "handlers::oracle_handler"
  image: arkhe/lambda-t-oracle:latest
  trigger:
    type: "Decay"
    lifetimePs: 0.25
  coherenceSigma: 7.0
---
apiVersion: arkhe.io/v1alpha1
kind: LambdaT
metadata:
  name: memory
  namespace: arkhe
spec:
  handler: "handlers::memory_handler"
  image: arkhe/lambda-t-memory:latest
  trigger:
    type: "Intent"
  coherenceSigma: 5.0
---
apiVersion: arkhe.io/v1alpha1
kind: LambdaT
metadata:
  name: scheduler
  namespace: arkhe
spec:
  handler: "handlers::scheduler_handler"
  image: arkhe/lambda-t-scheduler:latest
  trigger:
    type: "Schedule"
  coherenceSigma: 3.0
