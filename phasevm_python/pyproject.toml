[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "phasevm"
version = "0.1.0"
description = "Python bindings for PhaseVM JIT compiler (Rust/Cranelift) with async support and warm-up cache"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "asyncio"]
authors = [
    {name = "Arkhe(n) Architect-Physicist", email = "arkhe@arkhe.os"}
]
license = "MIT"
keywords = ["jit", "compiler", "phasevm", "topological", "quantum"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "black", "mypy"]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "phasevm.phasevm_rs"
python-source = "python"
targets = ["x86_64-pc-windows-msvc"]  # Windows target

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
