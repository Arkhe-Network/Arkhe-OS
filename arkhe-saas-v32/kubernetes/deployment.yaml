# deployment.yaml (API Node.js)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arkhe-api
  namespace: arkhe
spec:
  replicas: 3
  selector:
    matchLabels:
      app: arkhe-api
  template:
    metadata:
      labels:
        app: arkhe-api
    spec:
      containers:
      - name: api
        image: arkhe/api:latest
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: arkhe-secrets
              key: postgres-url
        - name: REDIS_URL
          value: redis://redis-service:6379
        - name: AWS_REGION
          value: us-east-1
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: arkhe-api-svc
  namespace: arkhe
spec:
  selector:
    app: arkhe-api
  ports:
  - port: 80
    targetPort: 3000
  type: ClusterIP
---
# Horizontal Pod Autoscaler (HPA)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: arkhe-api-hpa
  namespace: arkhe
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: arkhe-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70