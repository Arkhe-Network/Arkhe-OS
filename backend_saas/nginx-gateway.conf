# backend_saas/nginx-gateway.conf
worker_processes auto;
events {
    worker_connections 1024;
}

http {
    # Basic Rate Limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    server {
        listen 80;
        server_name api.arkhe.local;

        # Add global headers if needed
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1";
        add_header X-Content-Type-Options "nosniff";

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            # Forward the requests to the Node.js Loopback 4 backend
            proxy_pass http://arkhe-api-svc.arkhe.svc.cluster.local:3000/;

            # Ensure all headers, including Authorization (JWT), are forwarded
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
        }

        # Health check endpoint for the Gateway itself
        location /health {
            access_log off;
            return 200 "OK\n";
        }
    }
}