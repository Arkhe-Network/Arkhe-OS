[package]
license.workspace = true
name = "arkhe-core"
version = "0.1.0"
edition = "2021"

[dependencies]
nalgebra = "0.35.0"
regex = "1"
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
tracing = "0.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "symmetry_benchmarks"
harness = false
