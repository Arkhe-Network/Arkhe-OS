[package]
name = "timechain"
version = "0.1.0"
edition = "2021"

[dependencies]
ndarray = { version = "0.17", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
rand = "0.8"
tokio = { version = "1.0", features = ["full"] }
rayon = "1.7"
num-traits = "0.2"
num-complex = "0.4"
sha2 = "0.10"
chrono = "0.4"
ndarray-linalg = { version = "0.16.0" }
