[package]
name = "phasevm"
version = "0.1.0"
edition = "2021"
description = "PhaseVM JIT compiler - cbytes to native x86_64/ARM via Cranelift"
authors = ["Arkhe(n) Architect-Physicist"]
license = "MIT"

[dependencies]
cranelift = "0.105.0"
cranelift-jit = "0.105.0"
cranelift-frontend = "0.105.0"
cranelift-native = "0.105.0"
cranelift-codegen = "0.105.0"
cranelift-module = "0.105.0"
pyo3 = { version = "0.20", features = ["extension-module"] }
crossbeam-channel = "0.5"
num-complex = "0.4"

[dev-dependencies]
num-complex = "0.4"

[lib]
name = "phasevm"
path = "src/lib.rs"

[[bin]]
name = "phasevm-cli"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
